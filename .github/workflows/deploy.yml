name: Deploy Web (S3 + CloudFront)

on:
  push:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      env:
        description: 'Environment to deploy to (prod|dev)'
        required: false
        default: 'dev'
        type: choice
        options:
          - prod
          - dev

concurrency:
  group: web-deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      ENVIRONMENT: ${{ inputs.env || 'dev' }}
      WEB_BUCKET: ${{ (inputs.env || 'dev') == 'dev' && secrets.WEB_S3_BUCKET_DEV || secrets.WEB_S3_BUCKET }}
      CLOUDFRONT_DIST_ID_WEB: ${{ (inputs.env || 'dev') == 'dev' && secrets.CLOUDFRONT_DISTRIBUTION_ID_WEB_DEV || secrets.CLOUDFRONT_DISTRIBUTION_ID_WEB }}
      # Inject client-exposed build-time variables (Astro/Vite exposes PUBLIC_* only)
      PUBLIC_APP_ENV: ${{ inputs.env || 'dev' }}
      PUBLIC_API_URL: ${{ (inputs.env || 'dev') == 'dev' && secrets.DEV_PUBLIC_API_URL || secrets.PROD_PUBLIC_API_URL }}
      PUBLIC_PROJECT_NAME: ${{ (inputs.env || 'dev') == 'dev' && secrets.DEV_PUBLIC_PROJECT_NAME || secrets.PROD_PUBLIC_PROJECT_NAME }}
      PUBLIC_GOOGLE_CLIENT_ID: ${{ (inputs.env || 'dev') == 'dev' && secrets.DEV_PUBLIC_GOOGLE_CLIENT_ID || secrets.PROD_PUBLIC_GOOGLE_CLIENT_ID }}
      PUBLIC_STRIPE_PUBLISHABLE_KEY: ${{ (inputs.env || 'dev') == 'dev' && secrets.DEV_PUBLIC_STRIPE_PUBLISHABLE_KEY || secrets.PROD_PUBLIC_STRIPE_PUBLISHABLE_KEY }}
      PUBLIC_TURNSTILE_SITE_KEY: ${{ (inputs.env || 'dev') == 'dev' && (secrets.DEV_PUBLIC_TURNSTILE_SITE_KEY || '0x4AAAAAAEFg4oQVL_JDuYjS') || (secrets.PROD_PUBLIC_TURNSTILE_SITE_KEY || '0x4AAAAAAEFg4oQVL_JDuYjS') }}
      # Public site URL to build absolute canonical/OG URLs
      PUBLIC_SITE_URL: ${{ (inputs.env || 'dev') == 'dev' && 'https://dev.brickify.fun' || 'https://brickify.fun' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        env:
          # Force linux-x64 binaries for native modules like sharp
          npm_config_platform: linux
          npm_config_arch: x64
        run: npm ci

      - name: Build
        run: npm run build

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Upload to S3
        run: |
          aws s3 sync ./dist s3://${WEB_BUCKET} \
            --delete \
            --only-show-errors \
            --cache-control "public, max-age=2592000, s-maxage=2592000"

      - name: Invalidate CloudFront
        run: |
          aws cloudfront create-invalidation --distribution-id ${CLOUDFRONT_DIST_ID_WEB} --paths '/*'

# Required repository secrets:
# - AWS_ACCESS_KEY_ID
# - AWS_SECRET_ACCESS_KEY
# - AWS_REGION (optional; defaults to us-east-1 if not set)
# - WEB_S3_BUCKET (prod) and WEB_S3_BUCKET_DEV (dev)
# - CLOUDFRONT_DISTRIBUTION_ID_WEB (prod) and CLOUDFRONT_DISTRIBUTION_ID_WEB_DEV (dev)
# - DEV_PUBLIC_API_URL, DEV_PUBLIC_PROJECT_NAME, DEV_PUBLIC_GOOGLE_CLIENT_ID, DEV_PUBLIC_STRIPE_PUBLISHABLE_KEY
# - PROD_PUBLIC_API_URL, PROD_PUBLIC_PROJECT_NAME, PROD_PUBLIC_GOOGLE_CLIENT_ID, PROD_PUBLIC_STRIPE_PUBLISHABLE_KEY
