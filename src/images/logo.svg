<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
    <defs>
        <linearGradient id="headGradient" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" style="stop-color:#60A5FA"/>
            <stop offset="100%" style="stop-color:#3B82F6"/>
        </linearGradient>
        <linearGradient id="glassesGradient" x1="0%" y1="0%" x2="100%" y2="0%">
            <stop offset="0%" style="stop-color:#F59E0B"/>
            <stop offset="100%" style="stop-color:#D97706"/>
        </linearGradient>
    </defs>

    <!-- Base head shape -->
    <path d="
    M60 140
    L60 80
    Q60 50 100 50
    Q140 50 140 80
    L140 140
    Q100 150 60 140
    Z
  " fill="url(#headGradient)"/>

    <!-- Connector piece -->
    <path d="
    M70 140
    L70 155
    Q100 165 130 155
    L130 140
    Q100 150 70 140
    Z
  " fill="#2563EB"/>

    <!-- Glasses frame -->
    <path d="M75 90 H125" stroke="url(#glassesGradient)" stroke-width="4"/>
    <circle cx="85" cy="90" r="12" fill="none" stroke="url(#glassesGradient)" stroke-width="4"/>
    <circle cx="115" cy="90" r="12" fill="none" stroke="url(#glassesGradient)" stroke-width="4"/>

    <!-- Stylized hair -->
    <path d="
    M65 70
    Q100 40 135 70
  " fill="none" stroke="#1F2937" stroke-width="8" stroke-linecap="round"/>
    <path d="
    M70 65
    Q100 35 130 65
  " fill="none" stroke="#1F2937" stroke-width="6" stroke-linecap="round"/>
</svg>
